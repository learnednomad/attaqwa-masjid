[supervisord]
nodaemon=true
user=nodejs
logfile=/app/logs/supervisord.log
pidfile=/tmp/supervisord.pid

[program:api]
command=node /app/packages/api/dist/index.js
directory=/app
autostart=true
autorestart=true
stderr_logfile=/app/logs/api.err.log
stdout_logfile=/app/logs/api.out.log
environment=NODE_ENV="production",PORT="3001"
user=nodejs

[program:web]
command=node /app/packages/web/.next/standalone/server.js
directory=/app/packages/web
autostart=true
autorestart=true
stderr_logfile=/app/logs/web.err.log
stdout_logfile=/app/logs/web.out.log
environment=NODE_ENV="production",PORT="3000",HOSTNAME="0.0.0.0"
user=nodejs

[group:attaqwa]
programs=api,web
priority=999