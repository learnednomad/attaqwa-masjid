# Enhanced Server Configuration for Attaqwa Masjid
# Optimized for Islamic services and brownfield integration

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    
    server_name localhost attaqwa.local *.attaqwa.local;
    
    # Root directory for static files
    root /var/www/html;
    index index.html index.htm;

    # Enhanced logging for Islamic services
    access_log /var/log/nginx/enhanced_access.log main;
    error_log /var/log/nginx/enhanced_error.log warn;

    # Security headers for Islamic content protection
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https:; font-src 'self' https:; connect-src 'self' https: wss:;" always;

    # Islamic calendar and prayer times optimization
    location /api/islamic/ {
        proxy_pass http://api_servers;
        
        # Enhanced caching for Islamic calendar data
        proxy_cache islamic_cache;
        proxy_cache_valid 200 24h;  # Cache Islamic calendar for 24 hours
        proxy_cache_key "$scheme$request_method$host$request_uri$arg_month$arg_year";
        
        # Add Islamic-specific headers
        add_header X-Islamic-Calendar-Cache $upstream_cache_status;
        add_header X-Service-Type "Islamic-Calendar";
        
        # Optimized for Hijri calendar requests
        if ($arg_calendar = "hijri") {
            add_header X-Calendar-Type "Hijri";
        }
    }

    # Qibla direction service optimization
    location /api/qibla {
        proxy_pass http://api_servers;
        
        # Cache Qibla calculations by coordinates
        proxy_cache islamic_cache;
        proxy_cache_valid 200 7d;  # Cache for 7 days (coordinates don't change)
        proxy_cache_key "$scheme$request_method$host$request_uri$arg_lat$arg_lng";
        
        add_header X-Qibla-Cache $upstream_cache_status;
        add_header X-Service-Type "Qibla-Direction";
    }

    # Educational content with age-tier filtering
    location /api/education/ {
        proxy_pass http://api_servers;
        
        # Cache educational content by age tier
        proxy_cache islamic_cache;
        proxy_cache_valid 200 6h;
        proxy_cache_key "$scheme$request_method$host$request_uri$arg_age_tier";
        
        add_header X-Education-Cache $upstream_cache_status;
        add_header X-Service-Type "Islamic-Education";
        
        # Enhanced security for children's content
        if ($arg_age_tier ~ "^(children|youth)$") {
            add_header X-Content-Safety "child-safe";
        }
    }

    # Mobile app specific optimizations
    location /api/mobile/ {
        proxy_pass http://api_servers;
        
        # Mobile-optimized headers
        add_header X-Mobile-Optimized "true";
        add_header X-Compression-Enabled "true";
        
        # Smaller cache TTL for mobile updates
        proxy_cache islamic_cache;
        proxy_cache_valid 200 1h;
        proxy_cache_key "$scheme$request_method$host$request_uri$http_x_islamic_app";
    }

    # WebSocket support for real-time features
    location /ws {
        proxy_pass http://api_servers;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket timeout settings
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Admin panel with enhanced security
    location /admin {
        # Rate limiting for admin access
        limit_req zone=auth_limit burst=3 nodelay;
        
        proxy_pass http://web_servers;
        
        # Enhanced security for admin panel
        add_header X-Frame-Options "DENY";
        add_header X-Admin-Panel "protected";
        
        # Block common attack patterns
        location ~ \.(php|asp|aspx|jsp)$ {
            deny all;
        }
    }

    # Monitoring endpoints
    location /metrics {
        proxy_pass http://api_servers;
        
        # Restrict to internal networks only
        allow 172.20.0.0/16;
        allow 127.0.0.1;
        deny all;
        
        add_header X-Service-Type "Metrics";
    }

    # Static assets with Islamic content optimization
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary "Accept-Encoding";
        
        # Special handling for Arabic fonts
        location ~* \.(woff|woff2|ttf|eot)$ {
            add_header Access-Control-Allow-Origin "*";
            add_header X-Font-Type "Islamic-Arabic";
            expires 1y;
        }
        
        # Islamic imagery optimization
        location ~* \.(png|jpg|jpeg|gif|svg)$ {
            add_header X-Content-Type "Islamic-Media";
            expires 30d;
        }
        
        try_files $uri @web;
    }

    # Fallback to web servers for all other requests
    location @web {
        proxy_pass http://web_servers;
    }

    # Error pages with Islamic theming
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    
    location = /404.html {
        internal;
        add_header X-Error-Type "Not-Found";
    }
    
    location = /50x.html {
        internal;
        add_header X-Error-Type "Server-Error";
    }

    # Block unwanted bots and crawlers
    if ($http_user_agent ~* (bot|crawler|spider|scraper)) {
        return 429 "Rate Limited";
    }

    # Block suspicious requests
    location ~ \.(env|log|conf|config|backup|bak|old|tmp)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}