# Enhanced Nginx Configuration for Attaqwa Masjid Digital Ecosystem
# Optimized for Islamic services, mobile compatibility, and brownfield integration

worker_processes auto;
worker_rlimit_nofile 8192;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging Configuration
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    log_format islamic_services '$remote_addr - $remote_user [$time_local] '
                               '"$request" $status $body_bytes_sent '
                               '"$http_referer" "$http_user_agent" '
                               '"$http_x_islamic_app" "$http_x_request_context" '
                               'rt=$request_time api_layer="$upstream_http_x_api_layer"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Performance Optimization
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Rate Limiting for API Protection
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=prayer_limit:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=20r/m;

    # Islamic Services Cache Zone
    proxy_cache_path /var/cache/nginx/islamic_services levels=1:2 keys_zone=islamic_cache:10m 
                     max_size=100m inactive=60m use_temp_path=off;

    # Upstream Servers
    upstream api_servers {
        least_conn;
        server api:3001 max_fails=3 fail_timeout=30s;
        server api:3002 max_fails=3 fail_timeout=30s backup;
        keepalive 32;
    }

    upstream web_servers {
        least_conn;
        server web:3000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # Security Headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Islamic Services Optimization
    map $http_x_islamic_app $cache_prayer_times {
        default 0;
        "AttaqwaMasjid" 1;
        "AttaqwaWeb" 1;
    }

    # Mobile App Detection
    map $http_user_agent $mobile_request {
        default 0;
        "~*AttaqwaMasjid" 1;
        "~*Mobile|Android|iPhone|iPad" 1;
    }

    server {
        listen 80;
        server_name _;

        # Health Check Endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # API Routes with Islamic Services Optimization
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://api_servers;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Mobile-Request $mobile_request;

            proxy_cache_bypass $http_upgrade;
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            # Special handling for prayer times
            location ~ ^/api/prayer-times {
                limit_req zone=prayer_limit burst=10 nodelay;
                
                access_log /var/log/nginx/islamic_services.log islamic_services;
                
                proxy_pass http://api_servers;
                proxy_cache islamic_cache;
                proxy_cache_valid 200 1h;
                proxy_cache_key "$scheme$request_method$host$request_uri$http_x_islamic_app";
                proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
                
                add_header X-Cache-Status $upstream_cache_status;
                add_header X-Islamic-Service "Prayer-Times";
            }

            # Authentication endpoints with stricter limits
            location ~ ^/api/(auth|login|register) {
                limit_req zone=auth_limit burst=5 nodelay;
                proxy_pass http://api_servers;
            }
        }

        # Static Assets Optimization
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Vary Accept-Encoding;
            
            # Serve from web servers
            proxy_pass http://web_servers;
            proxy_cache islamic_cache;
            proxy_cache_valid 200 1d;
        }

        # Web Application
        location / {
            proxy_pass http://web_servers;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Mobile-Request $mobile_request;

            proxy_cache_bypass $http_upgrade;
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Next.js specific headers
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }

        # Block access to sensitive files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~ \.(md|env|log|config)$ {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}