# Enhanced Redis Configuration for Attaqwa Masjid Digital Ecosystem
# Optimized for Islamic services caching and prayer times

#------------------------------------------------------------------------------
# NETWORK CONFIGURATION
#------------------------------------------------------------------------------

# Bind to all interfaces within Docker network
bind 0.0.0.0
port 6379
tcp-backlog 511
timeout 300
tcp-keepalive 300

#------------------------------------------------------------------------------
# GENERAL CONFIGURATION
#------------------------------------------------------------------------------

# Run as daemon in Docker container
daemonize no
supervised no
pidfile /var/run/redis_6379.pid

# Logging optimized for Islamic services monitoring
loglevel notice
logfile ""
syslog-enabled no

# Database configuration for Islamic services
databases 16
save 900 1
save 300 10
save 60 10000

# Default database for Islamic services cache
# DB 0: Prayer times cache
# DB 1: Islamic calendar cache
# DB 2: Educational content cache
# DB 3: User sessions
# DB 4: API rate limiting

stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir ./

#------------------------------------------------------------------------------
# REPLICATION CONFIGURATION
#------------------------------------------------------------------------------

replica-serve-stale-data yes
replica-read-only yes
repl-diskless-sync no
repl-diskless-sync-delay 5
repl-ping-replica-period 10
repl-timeout 60
repl-disable-tcp-nodelay no
replica-priority 100

#------------------------------------------------------------------------------
# SECURITY CONFIGURATION
#------------------------------------------------------------------------------

# Password protection for Islamic services
requirepass redis_secure_password_2024

# Disable dangerous commands
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command KEYS ""
rename-command CONFIG "CONFIG_b835b4c5b3d9b2e4a7d8f3e9c1a6b4d2"
rename-command SHUTDOWN SHUTDOWN_CONFIRM

#------------------------------------------------------------------------------
# MEMORY MANAGEMENT
#------------------------------------------------------------------------------

# Memory optimization for Islamic services
maxmemory 256mb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# Key expiration for Islamic services optimization
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes

#------------------------------------------------------------------------------
# APPEND ONLY FILE (AOF)
#------------------------------------------------------------------------------

# Enable AOF for prayer times persistence
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes

#------------------------------------------------------------------------------
# LUA SCRIPTING
#------------------------------------------------------------------------------

lua-time-limit 5000

#------------------------------------------------------------------------------
# REDIS CLUSTER
#------------------------------------------------------------------------------

# Disabled for single-instance Islamic services cache
# cluster-enabled no

#------------------------------------------------------------------------------
# SLOW LOG
#------------------------------------------------------------------------------

# Monitor slow queries for Islamic services optimization
slowlog-log-slower-than 10000
slowlog-max-len 128

#------------------------------------------------------------------------------
# LATENCY MONITORING
#------------------------------------------------------------------------------

latency-monitor-threshold 100

#------------------------------------------------------------------------------
# EVENT NOTIFICATION
#------------------------------------------------------------------------------

# Keyspace notifications for Islamic services
notify-keyspace-events "AKE"

#------------------------------------------------------------------------------
# ADVANCED CONFIG
#------------------------------------------------------------------------------

# Hash table optimization
hash-max-ziplist-entries 512
hash-max-ziplist-value 64

# List optimization for Islamic calendar events
list-max-ziplist-size -2
list-compress-depth 0

# Set optimization
set-max-intset-entries 512

# Sorted set optimization for prayer times ranking
zset-max-ziplist-entries 128
zset-max-ziplist-value 64

# HyperLogLog optimization
hll-sparse-max-bytes 3000

# Stream optimization for real-time notifications
stream-node-max-bytes 4096
stream-node-max-entries 100

#------------------------------------------------------------------------------
# ACTIVE DEFRAGMENTATION
#------------------------------------------------------------------------------

# Memory defragmentation for long-running Islamic services cache
activedefrag yes
active-defrag-ignore-bytes 100mb
active-defrag-threshold-lower 10
active-defrag-threshold-upper 100
active-defrag-cycle-min 5
active-defrag-cycle-max 75
active-defrag-max-scan-fields 1000

#------------------------------------------------------------------------------
# CLIENT OUTPUT BUFFER LIMITS
#------------------------------------------------------------------------------

# Optimized for Islamic services API clients
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

#------------------------------------------------------------------------------
# CLIENT QUERY BUFFER
#------------------------------------------------------------------------------

client-query-buffer-limit 1gb
proto-max-bulk-len 512mb

#------------------------------------------------------------------------------
# FREQUENCY AND BANDWIDTH
#------------------------------------------------------------------------------

hz 10
dynamic-hz yes

#------------------------------------------------------------------------------
# JEMALLOC CONFIGURATION
#------------------------------------------------------------------------------

# Optimized for Islamic services workload
jemalloc-bg-thread yes

#------------------------------------------------------------------------------
# CUSTOM ISLAMIC SERVICES CONFIGURATION
#------------------------------------------------------------------------------

# Key naming conventions for Islamic services:
# prayer:times:{lat}:{lng}:{date} - Prayer times cache (TTL: 1 hour)
# islamic:calendar:{year}:{month} - Islamic calendar cache (TTL: 24 hours)
# education:content:{age_tier}:{category} - Educational content cache (TTL: 6 hours)
# user:session:{user_id} - User session data (TTL: 24 hours)
# api:rate_limit:{ip}:{endpoint} - Rate limiting (TTL: 15 minutes)
# qibla:direction:{lat}:{lng} - Qibla direction cache (TTL: 7 days)

# Optimal TTL settings for different Islamic services:
# Prayer times: 3600 seconds (1 hour)
# Islamic calendar: 86400 seconds (24 hours)  
# Educational content: 21600 seconds (6 hours)
# Qibla direction: 604800 seconds (7 days)
# API responses: 300 seconds (5 minutes)
# Rate limiting: 900 seconds (15 minutes)