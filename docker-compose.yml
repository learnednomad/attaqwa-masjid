version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:14-alpine
    container_name: attaqwa-postgres
    environment:
      POSTGRES_DB: attaqwa_db
      POSTGRES_USER: attaqwa_user
      POSTGRES_PASSWORD: attaqwa_secure_2024!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/db/init:/docker-entrypoint-initdb.d
    networks:
      - attaqwa-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U attaqwa_user -d attaqwa_db']
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache (for session storage and caching)
  redis:
    image: redis:7-alpine
    container_name: attaqwa-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - attaqwa-network
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # API Backend Service
  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
      target: ${NODE_ENV:-development}
    container_name: attaqwa-api
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3001
      DATABASE_URL: postgresql://attaqwa_user:attaqwa_secure_2024%21@postgres:5432/attaqwa_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      ALADHAN_API_URL: https://api.aladhan.com/v1
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX_REQUESTS: 100
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "3001:3001"
    volumes:
      - ./packages/api:/app/packages/api:delegated
      - ./packages/shared:/app/packages/shared:delegated
      - ./packages/db:/app/packages/db:delegated
      - /app/node_modules
      - /app/packages/api/node_modules
    networks:
      - attaqwa-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3001/api/health']
      interval: 30s
      timeout: 10s
      retries: 3

  # Web Frontend Service
  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
      target: ${NODE_ENV:-development}
    container_name: attaqwa-web
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      NEXT_PUBLIC_ALADHAN_API_URL: https://api.aladhan.com/v1
      NEXT_PUBLIC_ENABLE_MOBILE_APP: false
      NEXT_PUBLIC_ENABLE_EDUCATION_MODULE: true
      NEXT_PUBLIC_ENABLE_DONATIONS: false
      NEXT_PUBLIC_DEFAULT_CITY: "New York"
      NEXT_PUBLIC_DEFAULT_COUNTRY: "US"
    ports:
      - "3000:3000"
    volumes:
      - ./packages/web:/app/packages/web:delegated
      - ./packages/shared:/app/packages/shared:delegated
      - /app/node_modules
      - /app/packages/web/node_modules
      - /app/packages/web/.next
    networks:
      - attaqwa-network
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Reverse Proxy (Production)
  nginx:
    image: nginx:alpine
    container_name: attaqwa-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
    networks:
      - attaqwa-network
    depends_on:
      - web
      - api
    restart: unless-stopped
    profiles:
      - production

  # Adminer Database Management (Development)
  adminer:
    image: adminer:latest
    container_name: attaqwa-adminer
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    networks:
      - attaqwa-network
    depends_on:
      - postgres
    restart: unless-stopped
    profiles:
      - development

networks:
  attaqwa-network:
    driver: bridge
    name: attaqwa-network

volumes:
  postgres_data:
    driver: local
    name: attaqwa-postgres-data
  redis_data:
    driver: local
    name: attaqwa-redis-data