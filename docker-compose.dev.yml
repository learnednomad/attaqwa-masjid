version: '3.8'

# Development-specific Docker Compose configuration
# Usage: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  # Development PostgreSQL with additional dev tools
  postgres:
    environment:
      POSTGRES_DB: attaqwa_db_dev
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5433:5432"  # Different port to avoid conflicts
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./packages/db/seed:/docker-entrypoint-initdb.d

  # API with hot reload and debugging
  api:
    build:
      target: development
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://dev_user:dev_password@postgres:5432/attaqwa_db_dev
      JWT_SECRET: dev-jwt-secret-key
      LOG_LEVEL: debug
    volumes:
      - ./packages/api/src:/app/packages/api/src:cached
      - ./packages/shared/src:/app/packages/shared/src:cached
      - ./packages/db:/app/packages/db:cached
    command: npm run dev
    stdin_open: true
    tty: true

  # Web with hot reload
  web:
    build:
      target: development
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:3001
    volumes:
      - ./packages/web/src:/app/packages/web/src:cached
      - ./packages/shared/src:/app/packages/shared/src:cached
      - ./packages/web/public:/app/packages/web/public:cached
    command: npm run dev
    stdin_open: true
    tty: true

  # Development tools
  adminer:
    profiles: []  # Always run in development

  # Mailhog for email testing
  mailhog:
    image: mailhog/mailhog:latest
    container_name: attaqwa-mailhog
    ports:
      - "1025:1025"  # SMTP server
      - "8025:8025"  # Web UI
    networks:
      - attaqwa-network
    restart: unless-stopped

volumes:
  postgres_dev_data:
    driver: local
    name: attaqwa-postgres-dev-data